<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 4 Science - Chapter 3 Matching Activity</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
            border-bottom: 2px solid #9b59b6;
            padding-bottom: 10px;
        }
        .instruction {
            text-align: center;
            color: #7f8c8d;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        .score-board {
            position: sticky;
            top: 10px;
            background: #2c3e50;
            color: white;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 1000;
            display: none;
        }
        .match-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 30px;
            position: relative;
        }
        .column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .item {
            background: #fafafa;
            border: 2px solid #dcdde1;
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .item:hover {
            border-color: #9b59b6;
            background: #f1f2f6;
        }
        .item.selected {
            border-color: #9b59b6;
            background: #f3e5f5;
            box-shadow: 0 0 8px rgba(155, 89, 182, 0.4);
        }
        .item.paired {
            border-color: #95a5a6;
            background: #eaeded;
            cursor: not-allowed;
        }
        .pair-tag {
            font-size: 0.8rem;
            background: #7f8c8d;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .submit-container {
            text-align: center;
            margin-top: 30px;
        }
        .submit-btn {
            background-color: #9b59b6;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 25px;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(155, 89, 182, 0.3);
        }
        .submit-btn:hover {
            background-color: #8e44ad;
        }
        .submit-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            box-shadow: none;
        }
        .warning-msg {
            color: #e74c3c;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
        }
        .explanation-box {
            margin-top: 30px;
            display: none;
            background: #f9f9f9;
            border-top: 3px solid #34495e;
            padding: 20px;
            border-radius: 4px;
        }
        .explanation-item {
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .text-success { color: #27ae60; border-color: #2ecc71 !important; background: #f4fbf7 !important;}
        .text-danger { color: #c0392b; border-color: #e74c3c !important; background: #fdf5f4 !important;}
    </style>
</head>
<body>

<div class="container">
    <h1>Class 4 Science: Chapter 3 - Match the Following</h1>
    <p class="instruction">Click an item on the Left, then click its corresponding match on the Right to link them together!</p>
    
    <div class="score-board" id="score-display"></div>

    <div class="match-wrapper">
        <div class="column" id="left-column"></div>
        <div class="column" id="right-column"></div>
    </div>

    <div class="submit-container">
        <div id="warning" class="warning-msg">Please match all items before submitting!</div>
        <button class="submit-btn" id="submit-btn" onclick="submitMatching()">Submit Answers</button>
    </div>

    <div class="explanation-box" id="explanation-box">
        <h3>📊 Answer Key & Explanations:</h3>
        <div id="explanation-list"></div>
    </div>
</div>

<script>
    const matchData = [
        { id: 1, left: "Carbohydrates", right: "Energy-giving food source", r: "Found in rice, wheat, and potatoes, carbs supply prompt power for movement." },
        { id: 2, left: "Proteins", right: "Body-building and repair food", r: "Vital for physical growth and tissue mending; rich in eggs, pulses, and milk." },
        { id: 3, left: "Roughage", right: "Indigestible plant fiber", r: "Helps move food through the digestive tract smoothly, preventing constipation." },
        { id: 4, left: "Saliva", right: "Digestive liquid in the mouth", r: "Softens food for swallowing and begins breaking down complex starches into simple sugars." },
        { id: 5, left: "Esophagus", right: "Pushes food down to the stomach", r: "Also known as the food pipe, it forms a muscular bridge from mouth to stomach." },
        { id: 6, left: "Small Intestine", right: "Absorbs nutrients into blood", r: "The longest section where digestion finishes and nutrient absorption happens." },
        { id: 7, left: "Large Intestine", right: "Absorbs extra water from waste", r: "Extracts remaining fluids from undigested material before it leaves the body." },
        { id: 8, left: "Balanced Diet", right: "All nutrients in correct portions", r: "Eating the right mix ensures the body has everything required to work properly." },
        { id: 9, left: "Preservation", right: "Prevents food from spoiling", r: "Methods like salting, pickling, or freezing slow down micro-organism growth." },
        { id: 10, left: "Fats", right: "Store energy for later use", r: "Provide extra insulation and backup energy reserves; found in butter, ghee, and oil." }
    ];

    let shuffledRight = [...matchData].sort(() => Math.random() - 0.5);

    let selectedLeft = null;
    let pairings = {}; 

    const leftCol = document.getElementById('left-column');
    const rightCol = document.getElementById('right-column');

    matchData.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerText = `${index + 1}. ${item.left}`;
        div.dataset.leftText = item.left;
        div.onclick = () => selectLeftItem(div);
        leftCol.appendChild(div);
    });

    shuffledRight.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerText = item.right;
        div.dataset.rightText = item.right;
        div.onclick = () => selectRightItem(div);
        rightCol.appendChild(div);
    });

    function selectLeftItem(element) {
        if (element.classList.contains('paired')) return;
        document.querySelectorAll('#left-column .item').forEach(el => el.classList.remove('selected'));
        selectedLeft = element;
        element.classList.add('selected');
    }

    function selectRightItem(element) {
        if (!selectedLeft || element.classList.contains('paired')) return;

        const leftText = selectedLeft.dataset.leftText;
        const rightText = element.dataset.rightText;

        selectedLeft.classList.remove('selected');
        selectedLeft.classList.add('paired');
        element.classList.add('paired');

        const tag = document.createElement('span');
        tag.className = 'pair-tag';
        tag.innerText = "Linked";
        selectedLeft.appendChild(tag);

        pairings[leftText] = rightText;
        selectedLeft = null; 
    }

    window.submitMatching = function() {
        if (Object.keys(pairings).length < matchData.length) {
            document.getElementById('warning').style.display = 'block';
            return;
        }
        document.getElementById('warning').style.display = 'none';

        let score = 0;
        const expList = document.getElementById('explanation-list');
        expList.innerHTML = '';

        matchData.forEach((item) => {
            const userSelection = pairings[item.left];
            const isCorrect = userSelection === item.right;
            
            const leftEl = Array.from(document.querySelectorAll('#left-column .item')).find(el => el.dataset.leftText === item.left);
            const rightEl = Array.from(document.querySelectorAll('#right-column .item')).find(el => el.dataset.rightText === userSelection);

            if (isCorrect) {
                score++;
                leftEl.classList.add('text-success');
                if (rightEl) rightEl.classList.add('text-success');
            } else {
                leftEl.classList.add('text-danger');
                if (rightEl) rightEl.classList.add('text-danger');
            }

            const expItem = document.createElement('div');
            expItem.className = 'explanation-item';
            expItem.innerHTML = `<strong>${item.left}</strong> &rarr; <span class="${isCorrect ? 'text-success' : 'text-danger'}">${item.right}</span><br><small style="color:#555;">${item.r}</small><hr style="border:0; border-top:1px solid #eee; margin:8px 0;">`;
            expList.appendChild(expItem);
        });

        const scoreDisplay = document.getElementById('score-display');
        scoreDisplay.style.display = 'block';
        scoreDisplay.style.backgroundColor = score >= 7 ? "#2ecc71" : "#e67e22";
        scoreDisplay.innerHTML = `🎉 Activity Evaluated! Total Marks: ${score} / ${matchData.length}`;

        document.getElementById('submit-btn').disabled = true;
        document.getElementById('explanation-box').style.display = 'block';
        document.querySelectorAll('.item').forEach(el => el.style.cursor = 'not-allowed');

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
