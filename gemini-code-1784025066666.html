<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 4 Science - Chapter 2 Quiz</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
            border-bottom: 2px solid #e67e22;
            padding-bottom: 10px;
        }
        .score-board {
            position: sticky;
            top: 10px;
            background: #2c3e50;
            color: white;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 1000;
            display: none;
        }
        .question-card {
            background: #fafafa;
            border-left: 4px solid #3498db;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 0 4px 4px 0;
            position: relative;
        }
        .question-text {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 12px;
            padding-right: 30px;
        }
        .options {
            margin-bottom: 5px;
        }
        .options label {
            cursor: pointer;
            margin-right: 15px;
            display: inline-block;
        }
        .submit-container {
            text-align: center;
            margin-top: 30px;
        }
        .submit-btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 25px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
        }
        .submit-btn:hover {
            background-color: #d35400;
        }
        .submit-btn:active {
            transform: scale(0.98);
        }
        .correct-card {
            border-left-color: #2ecc71;
            background: #f4fbf7;
        }
        .incorrect-card {
            border-left-color: #e74c3c;
            background: #fdf5f4;
        }
        .status-icon {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .text-success { color: #27ae60; }
        .text-danger { color: #c0392b; }
        .explanation {
            font-size: 0.9rem;
            color: #555;
            margin-top: 5px;
            font-style: italic;
            display: none;
        }
        .warning-msg {
            color: #e74c3c;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Class 4 Science: Chapter 2 (Animal Life)</h1>
    
    <div class="score-board" id="score-display"></div>

    <div id="quiz-container"></div>

    <div class="submit-container">
        <div id="warning" class="warning-msg">Please answer all questions before submitting!</div>
        <button class="submit-btn" id="main-submit-btn" onclick="submitAll()">Submit All Answers</button>
    </div>
</div>

<script>
    const quizData = [
        { q: "Animals that live on land are called aquatic animals.", a: false, r: "Land-dwelling animals are called terrestrial animals; aquatic animals live in water." },
        { q: "Frogs can breathe through both their lungs and their moist skin.", a: true, r: "Frogs are amphibians and use their skin to breathe when underwater." },
        { q: "Herbivores are animals that eat only the flesh of other animals.", a: false, r: "Herbivores eat plants. Animals that eat meat are called carnivores." },
        { q: "Omnivores eat both plants and meat.", a: true, r: "Humans, bears, and crows are examples of omnivores." },
        { q: "Birds reproduce by giving birth to live young ones.", a: false, r: "Birds lay eggs with hard shells to reproduce." },
        { q: "Mammals produce milk to feed their babies.", a: true, r: "This is a key characteristic of mammals like cows, dogs, and humans." },
        { q: "Camels store extra water directly in their humps.", a: false, r: "The hump stores fat, which can be broken down into energy and metabolic water when needed." },
        { q: "Arboreal animals spend most of their lives living in trees.", a: true, r: "Monkeys, squirrels, and tree lizards are typical arboreal animals." },
        { q: "Fish use gills to breathe oxygen dissolved in water.", a: true, r: "Gills extract oxygen from incoming water and release carbon dioxide." },
        { q: "Aerial animals are those that can fly and spend a lot of time in the air.", a: true, r: "Birds and bats are excellent examples of aerial animals." },
        { q: "Hibernation is a deep sleep some animals take to survive the hot summer.", a: false, r: "Hibernation is winter sleep. Summer sleep is called aestivation." },
        { q: "The white part inside a bird's egg is called the yolk.", a: false, r: "The white part is the albumen; the yellow inner part is the yolk." },
        { q: "Polar bears have thick fur and a layer of fat called blubber to stay warm.", a: true, r: "Blubber acts as insulation against freezing Arctic temperatures." },
        { q: "Insects like butterflies and moths have a four-stage life cycle.", a: true, r: "Their life cycle consists of egg, larva (caterpillar), pupa, and adult." },
        { q: "A tadpole looks exactly like an adult frog when it hatches.", a: false, r: "A tadpole looks like a small fish with a tail and lives completely underwater." },
        { q: "Cockroaches go through three distinct stages in their life cycle.", a: true, r: "They develop via egg, nymph, and adult stages, skipping the pupal phase." },
        { q: "Parasites live on or inside other living animals to get their food.", a: true, r: "Mosquitoes, leeches, and tapeworms are common examples of parasites." },
        { q: "Whales and dolphins are fish because they live underwater.", a: false, r: "They are mammals; they have lungs, come to the surface to breathe, and give birth to live young." },
        { q: "The process by which living things produce young ones of their own kind is called reproduction.", a: true, r: "Reproduction ensures the continuation of a species on Earth." },
        { q: "Penguins can fly high in mountain regions.", a: false, r: "Penguins are flightless birds whose wings have adapted into flippers for swimming." }
    ];

    const container = document.getElementById('quiz-container');

    quizData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${index}`;
        
        card.innerHTML = `
            <div class="question-text">${index + 1}. ${item.q}</div>
            <div class="status-icon" id="icon-${index}"></div>
            <div class="options">
                <label><input type="radio" name="q${index}" value="true"> True</label>
                <label><input type="radio" name="q${index}" value="false"> False</label>
            </div>
            <div class="explanation" id="exp-${index}"><strong>Why:</strong> ${item.r}</div>
        `;
        container.appendChild(card);
    });

    window.submitAll = function() {
        let totalScore = 0;
        let allAnswered = true;
        const warning = document.getElementById('warning');

        for (let index = 0; index < quizData.length; index++) {
            const radios = document.getElementsByName(`q${index}`);
            let answered = false;
            for (const radio of radios) {
                if (radio.checked) answered = true;
            }
            if (!answered) {
                allAnswered = false;
                break;
            }
        }

        if (!allAnswered) {
            warning.style.display = "block";
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            return;
        }

        warning.style.display = "none";

        quizData.forEach((item, index) => {
            const radios = document.getElementsByName(`q${index}`);
            let selectedValue = null;
            
            for (const radio of radios) {
                selectedValue = radio.checked ? (radio.value === "true") : selectedValue;
                radio.disabled = true;
            }

            const card = document.getElementById(`card-${index}`);
            const iconDiv = document.getElementById(`icon-${index}`);
            const expDiv = document.getElementById(`exp-${index}`);
            
            const isCorrect = selectedValue === item.a;
            expDiv.style.display = "block";

            if (isCorrect) {
                totalScore++;
                card.classList.add('correct-card');
                iconDiv.innerHTML = '&#10004;';
                iconDiv.className = 'status-icon text-success';
            } else {
                card.classList.add('incorrect-card');
                iconDiv.innerHTML = '&#10006;';
                iconDiv.className = 'status-icon text-danger';
            }
        });

        const scoreDisplay = document.getElementById('score-display');
        scoreDisplay.style.display = "block";
        scoreDisplay.style.backgroundColor = totalScore >= 15 ? "#2ecc71" : "#e67e22";
        scoreDisplay.innerHTML = `🎉 Quiz Completed! Final Score: ${totalScore} / ${quizData.length}`;

        document.getElementById('main-submit-btn').disabled = true;
        document.getElementById('main-submit-btn').style.backgroundColor = "#bdc3c7";
        document.getElementById('main-submit-btn').style.cursor = "not-allowed";

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>
